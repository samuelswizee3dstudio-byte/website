name = "swizee-rebuild-drain"
main = "rebuild-drain.js"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Every 2 minutes. The worker only spends a deploy once edits have been quiet
# for QUIET_PERIOD_MS (3 minutes), so this is just how often it looks.
[triggers]
crons = ["*/2 * * * *"]

[[kv_namespaces]]
binding = "REBUILD_STATE"
id = "de81dfb106124b4a98cf5e71f703e194"

# DEPLOY_HOOK_URL is set as a secret:
#   npx wrangler secret put DEPLOY_HOOK_URL --config workers/wrangler.toml
