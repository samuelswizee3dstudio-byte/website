[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"

# www -> apex, permanent.
[[redirects]]
  from = "https://www.swizee.co.uk/*"
  to = "https://swizee.co.uk/:splat"
  status = 301
  force = true

# /api/checkout is routed by the function's own `export const config = { path }`
# in netlify/functions/create-checkout-session.mjs — no redirect needed here.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"
